.animate-glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.animate-twinkle,.animate-flicker,.animate-glow{animation:none!important}}
